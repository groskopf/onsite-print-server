services:
  nginx:
    volumes:
      - ../onsite-print-web-server/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips "*"
    volumes:
      - ../onsite-print-backend/app:/srv/app:ro

  attendee:
    build:
      target: development
    image: onsite-print-attendee-dev
    command: sh -c "npm ci && npm run dev -- --port 80"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../onsite-print-attendee:/app
      - attendee-node-modules:/app/node_modules

  checkin:
    build:
      target: development
    image: onsite-print-checkin-dev
    command: sh -c "npm ci && npm run dev -- --port 80"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../onsite-print-checkin:/app
      - checkin-node-modules:/app/node_modules

volumes:
  attendee-node-modules:
  checkin-node-modules:
