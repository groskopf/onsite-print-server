name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server
        uses: actions/checkout@v4
        with:
          path: onsite-print-server

      - name: Check out web server
        uses: actions/checkout@v4
        with:
          repository: groskopf/onsite-print-web-server
          path: onsite-print-web-server

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: groskopf/onsite-print-backend
          path: onsite-print-backend

      - name: Check out database
        uses: actions/checkout@v4
        with:
          repository: groskopf/onsite-print-database
          path: onsite-print-database

      - name: Check out attendee
        uses: actions/checkout@v4
        with:
          repository: groskopf/onsite-print-attendee
          path: onsite-print-attendee

      - name: Check out checkin
        uses: actions/checkout@v4
        with:
          repository: groskopf/onsite-print-checkin
          path: onsite-print-checkin

      - name: Create database password
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p onsite-print-database/secrets
          openssl rand -base64 32 > onsite-print-database/secrets/postgres_password

      - name: Build and start local stack
        working-directory: ${{ github.workspace }}/onsite-print-server
        run: docker compose -f compose.yaml up -d --build --wait --wait-timeout 300

      - name: Run full test suite
        working-directory: ${{ github.workspace }}/onsite-print-server
        run: bash run-tests.sh --smoke

      - name: Stop local stack
        if: always()
        working-directory: ${{ github.workspace }}/onsite-print-server
        run: docker compose -f compose.yaml down
