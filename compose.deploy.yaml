services:
  nginx:
    image: ghcr.io/groskopf/onsite-print-web-server:${WEB_SERVER_TAG:?Set WEB_SERVER_TAG}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      attendee:
        condition: service_healthy
      checkin:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  attendee:
    image: ghcr.io/groskopf/onsite-print-attendee:${ATTENDEE_TAG:?Set ATTENDEE_TAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/attendee/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  checkin:
    image: ghcr.io/groskopf/onsite-print-checkin:${CHECKIN_TAG:?Set CHECKIN_TAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/checkin/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/groskopf/onsite-print-backend:${BACKEND_TAG:?Set BACKEND_TAG}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onsite_print
      DB_USER: onsite_print
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: ghcr.io/groskopf/onsite-print-database:${DATABASE_TAG:?Set DATABASE_TAG}
    environment:
      POSTGRES_USER: onsite_print
      POSTGRES_DB: onsite_print
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsite_print -d onsite_print"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}

volumes:
  postgres-data:
